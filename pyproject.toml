[project]
name = "commission_split"
version = "0.1.0"
description = "Commission Split Agent (CrewAI) — distributes commission across agent hierarchy"
requires-python = ">=3.11"
dependencies = [
    "crewai[tools]>=1.9.0",
    "litellm>=1.0.0",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
commission_split = "commission_split.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commission_split"]
